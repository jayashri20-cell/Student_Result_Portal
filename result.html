<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <nav class="navbar navbar-dark">
        <div class="container">

            <span class="navbar-brand">
                <i class="bi bi-mortarboard-fill"></i>
                Student Portal
            </span>

        </div>
    </nav>


    <!-- Result Container -->
    <div class="container result-container">

        <div class="page-heading">
            <h1>Student Result</h1>
            <p>Examination result details</p>
        </div>


        <!-- Student Information -->
        <div class="card portal-card mb-4">

            <div class="card-header">
                <i class="bi bi-person-fill"></i>
                Student Information
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-6 info-box">
                        <strong>Student Name</strong>
                        <span id="resultName"></span>
                    </div>

                    <div class="col-md-6 info-box">
                        <strong>Register Number</strong>
                        <span id="resultRegister"></span>
                    </div>

                    <div class="col-md-6 info-box">
                        <strong>Email</strong>
                        <span id="resultEmail"></span>
                    </div>

                    <div class="col-md-6 info-box">
                        <strong>Phone Number</strong>
                        <span id="resultPhone"></span>
                    </div>

                    <div class="col-md-12 info-box">
                        <strong>Course</strong>
                        <span id="resultCourse"></span>
                    </div>

                </div>

            </div>

        </div>


        <!-- Marks -->
        <div class="card portal-card mb-4">

            <div class="card-header">
                <i class="bi bi-bar-chart-fill"></i>
                Examination Result
            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered result-table">

                        <thead>
                            <tr>
                                <th>Subject</th>
                                <th>Marks</th>
                                <th>Result</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr>
                                <td>HTML</td>
                                <td id="resultHtml"></td>
                                <td id="htmlStatus"></td>
                            </tr>

                            <tr>
                                <td>Bootstrap</td>
                                <td id="resultBootstrap"></td>
                                <td id="bootstrapStatus"></td>
                            </tr>

                            <tr>
                                <td>JavaScript</td>
                                <td id="resultJavascript"></td>
                                <td id="javascriptStatus"></td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>


        <!-- Result Summary -->
        <div class="card portal-card">

            <div class="card-header">
                <i class="bi bi-award-fill"></i>
                Result Summary
            </div>

            <div class="card-body">

                <div class="summary-row">

                    <div class="summary-box">
                        <h6>Total Marks</h6>
                        <h3 id="totalMarks"></h3>
                        <p>out of 300</p>
                    </div>


                    <div class="summary-box">
                        <h6>Percentage</h6>
                        <h3 id="percentage"></h3>
                        <p>Overall</p>
                    </div>

                </div>


                <div
                    id="finalResult"
                    class="final-result">
                </div>


                <!-- Back Button -->
                <div class="text-center mt-4">

                    <a
                        href="index.html"
                        class="btn back-btn"
                    >
                        <i class="bi bi-arrow-left"></i>
                        Back to Registration
                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Custom JS -->
    <script src="script.js"></script>

</body>
</html>
